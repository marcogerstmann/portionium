#cloud-config
#
# The gap between a fresh Ubuntu image and `docker compose up -d`. Nothing in this repository
# reads it: it is handed to the provider as user data when the server is created, see
# docs/runbooks/deploy.md. Why there is no Terraform or Ansible is
# docs/adr/009-hosting-and-deployment.md.

# cloud-init creates users before any package is installed, so without this the user below
# references a group that does not exist yet and the run fails.
groups:
  - docker

users:
  - name: deploy
    shell: /bin/bash
    # Root equivalent: anyone in the docker group can mount the host filesystem into a
    # container. The boundary is that only a key opens this machine at all.
    groups: [docker]
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    # Copy this file to infra/cloud-init.yaml, which is gitignored, and paste your own public
    # key here. The placeholder is deliberately not a working key: a default that fails is
    # correct, a default that works for somebody else is not. Root is disabled below, so getting
    # this wrong means the provider's console is the way back in.
    ssh_authorized_keys:
      - ssh-ed25519 AAAA_REPLACE_THIS_WITH_YOUR_OWN_PUBLIC_KEY you@your-machine

ssh_pwauth: false
disable_root: true

write_files:
  # Docker's default json-file driver rotates nothing, and this process writes a JSON line per
  # request: unrotated, the disk fills and SQLite starts failing writes.
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "5" }
      }

  # Ubuntu applies security updates unattended but never reboots, so a kernel fix sits installed
  # and unused. Every Compose service is `restart: unless-stopped`, so the app comes back. UTC.
  - path: /etc/apt/apt.conf.d/52-portionium-reboot
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:30";

package_update: true
package_upgrade: true

# From Ubuntu's repositories rather than get.docker.com, so Docker is patched by the same
# unattended-upgrades as everything else.
packages:
  - docker.io
  - docker-compose-v2
  - unattended-upgrades
  - git

runcmd:
  - [systemctl, enable, --now, docker]

# Deliberately not here:
#
#   ufw          The provider's own firewall does this outside the VM, where nothing that gets a
#                shell inside can switch it off, and every provider worth using has one. Two
#                firewalls is one more chance to lock yourself out and one more place to look
#                when a port is closed. On a provider with no external firewall, add ufw to the
#                packages above and open 22, 80 and 443 in runcmd.
#   fail2ban     Password authentication is off and root is disabled, so the thing it watches
#                for cannot succeed. It would be a log of failures nobody reads.
#   the app      Cloning the repository needs decisions this file should not make. It is three
#                commands in the runbook, run once, by a person who is watching.
