name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from the packageManager field, so it is pinned in one place.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm depcruise
      - run: pnpm test
      - run: pnpm build

      # A green depcruise that cruised nothing enforces nothing. Fail loudly instead.
      - name: Assert dependency-cruiser actually saw the sources
        run: |
          modules=$(pnpm exec depcruise api/src packages/schemas/src web/src \
            --config .dependency-cruiser.cjs \
            --output-type json | node -e \
            'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).summary.totalCruised))')
          echo "modules cruised: $modules"
          test "$modules" -gt 0
