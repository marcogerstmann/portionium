name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm depcruise
      - run: pnpm test
      - run: pnpm build

      # High and above only: a gate that fires on every moderate in a transitive dev dependency
      # is a gate people route around. Moderates are still in the output of the step above.
      - run: pnpm audit --audit-level high

      # A green depcruise that cruised nothing enforces nothing.
      - name: Assert dependency-cruiser actually saw the sources
        run: |
          modules=$(pnpm exec depcruise api/src packages/schemas/src web/src \
            --config .dependency-cruiser.cjs \
            --output-type json | node -e \
            'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).summary.totalCruised))')
          echo "modules cruised: $modules"
          test "$modules" -gt 0

  # The client in a real browser, against one API process serving the built bundle on its own
  # origin. The setup is all in web/playwright.config.ts, so this is the command a developer runs.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # --with-deps: a runner has none of the shared libraries a browser needs.
      - run: pnpm --filter @portionium/web exec playwright install --with-deps chromium

      - run: pnpm --filter @portionium/web e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # A backup that has never been restored is a hope. Its own job so the claim in the README is a
  # named check a stranger can follow in one click. It runs the runbook's own commands.
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Back up a seeded database, destroy it, restore it, check the records
        run: pnpm --filter @portionium/api exec vitest run test/backup.test.ts

  # The whole history rather than the diff: a later commit removing the line changes nothing
  # about who can read it. The binary rather than the marketplace action, which needs a licence
  # key in an organisation. The same scan runs in .githooks/pre-commit.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan the history for secrets
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          # --redact, so a finding does not become a second copy of the secret in the log.
          ./gitleaks git --redact --no-banner .
        env:
          GITLEAKS_VERSION: 8.30.1

  # A Dockerfile that compiles is not a Dockerfile that runs: the runtime stage ships
  # @portionium/schemas compiled, and only booting it would notice if that drifted.
  image:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # QEMU, for whichever half of a release this runner is not: a home deployment may be a
      # Raspberry Pi. Emulated, both architectures build in under two minutes, so this stays one
      # job rather than native runners and a manifest merge.
      - uses: docker/setup-qemu-action@v3
        if: startsWith(github.ref, 'refs/tags/v')

      - uses: docker/setup-buildx-action@v3

      # Loaded into the local daemon, so the steps below can actually run it.
      - name: Build for this machine
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: portionium:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 215 rather than 200: the image unpacks to 209 MiB, of which Node's own binary is 121 and
      # the production tree is 63, so 200 is not reachable on the official Node 24 image. The
      # limit sits just above where the image is, so it catches a regression.
      #
      # Measured off the unpacked filesystem: `docker image inspect .Size` reports the
      # uncompressed size on the classic store and the compressed size on the containerd one,
      # so asserting on it passes on a laptop and fails on a runner.
      - name: Assert the image is small enough
        run: |
          limit=$(( LIMIT_MIB * 1024 * 1024 ))
          size=$(( $(docker run --rm portionium:ci sh -c 'du -sk / 2>/dev/null | cut -f1') * 1024 ))
          echo "image unpacks to $(( size / 1024 / 1024 )) MiB, limit ${LIMIT_MIB} MiB"
          test "$size" -lt "$limit"
        env:
          LIMIT_MIB: 215

      # No environment at all, so the defaults baked into the image are what is tested.
      - name: Start it the way a first run does
        run: |
          docker run -d --name portionium -p 8080:3000 -v portionium-data:/data portionium:ci
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' portionium)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' portionium | grep -qx healthy \
            || { docker logs portionium; exit 1; }

      - name: Check what it serves
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/health | grep -q '"status":"ok"'
          # Also the only check that the migration journal shipped and resolves from dist/.
          curl -fsS http://localhost:8080/ready | grep -q '"status":"ready"'
          curl -fsS http://localhost:8080/ | grep -qi '<html'
          curl -fsS http://localhost:8080/settings | grep -qi '<html'
          curl -sS -o /dev/null -w '%{http_code} %{content_type}\n' \
            http://localhost:8080/api/v1/nope | grep -q '^404 application/problem+json'

      # On the volume, not in the container's writable layer.
      - name: Check the database landed on the volume
        run: docker run --rm -v portionium-data:/data alpine ls /data/portionium.db

      # The `restore` job proves a backup restores; this proves an untouched container takes one.
      - name: Check it backed itself up without being asked
        run: |
          set -euo pipefail
          docker run --rm -v portionium-data:/data alpine \
            sh -c 'ls /data/backups/portionium-*.db.gz' | grep -q '\.db\.gz$'

      - name: The process is not root
        run: test "$(docker exec portionium id -u)" != 0

      - name: Logs
        if: always()
        run: docker logs portionium || true

      - name: Sign in to the registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push both architectures
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
