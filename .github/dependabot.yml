# One pull request a week per ecosystem for patches and minors, and a separate one per major.
# What blocks a merge is the `verify` and `audit` jobs in ci.yml.

version: 2

updates:
  # One entry covers every package.json: Dependabot resolves the lockfile at the root.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Every version is an exact pin, see .npmrc, so a lockfile-only update would leave the
    # manifests saying something false.
    versioning-strategy: increase
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Pinned to 6.x: TypeScript 7 is the native compiler and neither typescript-eslint nor
      # dependency-cruiser can read its API yet. They move together.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']

# No docker entry on purpose: Dependabot does not read .nvmrc and cannot resolve a FROM whose
# tag comes from an ARG, so it would update neither of the two places the Node version lives.
