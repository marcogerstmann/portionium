# Dependency updates, grouped, because the failure mode of this file is not missing an update.
# It is fifteen pull requests on a Monday against a repository with one developer, which get
# batched into a "later" that never arrives, and then the one update that mattered is sitting
# underneath fourteen that did not.
#
# So: one pull request a week per ecosystem for everything that is a patch or a minor, and a
# separate one for each major, because a major is a change to read rather than a change to
# merge. What actually blocks a merge is the `verify` job in ci.yml, which is the whole test
# suite, plus `pnpm audit --audit-level high` in the `audit` job.

version: 2

updates:
  # The pnpm workspace. One entry covers every package.json in it, because Dependabot resolves
  # the lockfile at the root rather than each workspace on its own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Every version in this repository is an exact pin, see .npmrc, so a lockfile only update
    # would leave the manifests saying something false.
    versioning-strategy: increase
    groups:
      # The toolchain. It touches nothing a user runs, so a green CI run is the whole review.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      # What ships in the image. Grouped too, but worth reading the changelogs of.
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Pinned to 6.x on purpose: TypeScript 7 is the native compiler and neither
      # typescript-eslint nor dependency-cruiser can read its API yet. The two move together,
      # see the toolchain note in AGENTS.md, so a lone bump here is a red CI run by definition.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  # The workflows in .github/workflows. Pinned to major tags today, so this is mostly the
  # occasional v5, and a supply chain update to an action is exactly the kind that arrives
  # quietly.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']

# There is deliberately no docker entry. The Node version is written in two places that have to
# agree, .nvmrc and the NODE_VERSION build argument in the Dockerfile, and Dependabot can update
# neither: it does not read .nvmrc at all, and it cannot resolve a FROM whose tag comes from an
# ARG. An entry here would be configuration that looks like coverage and updates nothing. Moving
# Node is two lines and a CI run, done on purpose when a release is worth having.
