#   docker compose up -d                     http://localhost:8080
#   docker compose --profile caddy up -d     the same, behind https on a real domain
#
# App settings go in the optional .env.docker, which mirrors .env.example. The PORTIONIUM_*
# variables below are Compose's own and are read from the environment, not from that file.

name: portionium

services:
  app:
    build: .
    # Pin PORTIONIUM_TAG on a server. A rollback changes the image and nothing else: a migration
    # that dropped a column needs a restore, see docs/runbooks/backup.md.
    image: ghcr.io/marcogerstmann/portionium:${PORTIONIUM_TAG:-latest}
    restart: unless-stopped

    # Where a secret goes: `docker inspect` shows environment variables, a file with 600 on it
    # is not readable that way.
    env_file:
      - path: .env.docker
        required: false

    # Behind the caddy profile, set PORTIONIUM_BIND=127.0.0.1 so only the proxy can reach it.
    ports:
      - '${PORTIONIUM_BIND:-0.0.0.0}:${PORTIONIUM_PORT:-8080}:3000'

    volumes:
      - data:/data

    # No healthcheck here: the image declares its own.

  # Automatic TLS. A browser will not register a service worker on an insecure origin, so
  # without this the app on a domain is a website rather than something installable.
  #
  #   PORTIONIUM_DOMAIN=food.example.com PORTIONIUM_BIND=127.0.0.1 \
  #     docker compose --profile caddy up -d
  #
  # Set WEB_ORIGIN=https://your.domain in .env.docker too, or every write is refused.
  caddy:
    profiles: [caddy]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      # HTTP/3.
      - '443:443/udp'
    environment:
      # Not `${VAR:?message}`: Compose interpolates every service before it filters by profile,
      # so a required variable here would fail `up` for somebody not using this container.
      PORTIONIUM_DOMAIN: ${PORTIONIUM_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates and the account key. Let's Encrypt rate limits re-issuance.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        # So the first request after a deploy does not arrive during a migration.
        condition: service_healthy

volumes:
  data:
  caddy-data:
  caddy-config:
